[project]
name = "avito-test"
version = "0.1.0"
description = "Reproducible Avito candidate-generation pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bm25s>=0.2.14,<0.3",
    "catboost>=1.2.7",
    "einops>=0.8.2",
    "marimo>=0.25.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "safetensors>=0.4.5",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.5.0",
    "tqdm>=4.66.0",
    "transformers>=4.45.0",
]

[project.scripts]
avito = "avito_candidate_generation.cli:main"

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "hypothesis>=6.100.0",
    "pytest-cov>=6.0.0",
    "pyright>=1.1.390",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = [
    "BLE001",
    "TRY004",
    "FURB192",
    "PLR0124",
]
