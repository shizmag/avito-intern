[project]
repo_root = ".."
seed = 42

[artifacts]
root = "artifacts/selected"

[data]
train = "data/train.parquet"
benchmark_queries = "data/benchmark_queries.parquet"
benchmark_items = "data/benchmark_items.parquet"

[selection]
source = "rrf"
retrievers = ["bm25", "dense", "two_tower"]
category_policy = "hard"
retrieval_k = 500
metric = "recall@50"
fusion = "rrf"

[dense]
model = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
model_path = "artifacts/models/paraphrase-multilingual-MiniLM-L12-v2"
revision = "e8f8c211226b894fcb81acc59f3b34ba3efd5f42"
batch_size = 128
normalize = true
max_length = 64
device = "auto"

[two_tower]
dimension = 32
epochs = 1
batch_size = 32
temperature = 0.07
learning_rate = 0.001
device = "cpu"
vocab_size = 65537

[hard_negatives]
max_per_query = 20

[fusion]
rrf_k = 60
