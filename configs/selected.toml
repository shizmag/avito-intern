[project]
repo_root = ".."
seed = 42

[artifacts]
root = "artifacts/selected"

[data]
train = "data/train.parquet"
benchmark_queries = "data/benchmark_queries.parquet"
benchmark_items = "data/benchmark_items.parquet"

[selection]
source = "catboost"
retrievers = ["bm25", "dense", "two_tower"]
category_policy = "none"
retrieval_k = 500
candidate_pool = "rrf_top500"
metric = "recall@50"
fusion = "catboost"

[dense]
model = "intfloat/multilingual-e5-base"
model_path = "artifacts/models/multilingual-e5-base"
revision = "d128750597153bb5987e10b1c3493a34e5a4502a"
batch_size = 128
normalize = true
max_length = 128
device = "auto"
query_prefix = "query: "
item_prefix = "passage: "

[two_tower]
dimension = 32
epochs = 1
batch_size = 32
temperature = 0.07
learning_rate = 0.001
device = "cpu"
vocab_size = 65537

[hard_negatives]
max_per_query = 20

[fusion]
rrf_k = 60

[catboost]
iterations = 250
depth = 7
learning_rate = 0.08

[reranker]
model = "jinaai/jina-reranker-v2-base-multilingual"
model_id = "jinaai/jina-reranker-v2-base-multilingual"
model_path = "/Volumes/happy-disk/models/reranker/jina-reranker-v2-base-multilingual"
local_path = "/Volumes/happy-disk/models/reranker/jina-reranker-v2-base-multilingual"
revision = "9cfeff2df7d40d1b78e75e5e9cebec92a99813c9"
candidate_k = 500
final_k = 50
max_length = 256
batch_size = 64
device = "auto"
trust_remote_code = true
remote_code_reason = "Custom XLM-RoBERTa architecture with Flash Attention"
