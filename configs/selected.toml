[project]
repo_root = ".."
seed = 42

[artifacts]
root = "artifacts/selected"

[data]
train = "data/train.parquet"
benchmark_queries = "data/benchmark_queries.parquet"
benchmark_items = "data/benchmark_items.parquet"

[selection]
source = "catboost"
retrievers = ["bm25", "dense", "two_tower"]
category_policy = "none"
retrieval_k = 200
metric = "recall@50"
fusion = "catboost"

[dense]
model = "intfloat/multilingual-e5-base"
model_path = "artifacts/models/multilingual-e5-base"
revision = "d128750597153bb5987e10b1c3493a34e5a4502a"
batch_size = 128
normalize = true
max_length = 128
device = "auto"
query_prefix = "query: "
item_prefix = "passage: "

[two_tower]
dimension = 32
epochs = 1
batch_size = 32
temperature = 0.07
learning_rate = 0.001
device = "cpu"
vocab_size = 65537

[hard_negatives]
max_per_query = 20

[fusion]
rrf_k = 60

[catboost]
iterations = 250
depth = 7
learning_rate = 0.08
