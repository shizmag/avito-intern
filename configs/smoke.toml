[project]
repo_root = ".."
seed = 42

[artifacts]
root = "artifacts/smoke"

[selection]
retrieval_k = 2

[dense]
model = "fixture"

[two_tower]
dimension = 8
epochs = 1
batch_size = 2
learning_rate = 0.03

[hard_negatives]
max_per_query = 1

[fusion]
rrf_k = 10

[data]
train_queries = "tests/fixtures/train_queries.parquet"
train_items = "tests/fixtures/train_items.parquet"
train_pairs = "tests/fixtures/train_pairs.parquet"
validation_queries = "tests/fixtures/validation_queries.parquet"
validation_items = "tests/fixtures/validation_items.parquet"
validation_ground_truth = "tests/fixtures/validation_ground_truth.parquet"
benchmark_queries = "tests/fixtures/benchmark_queries.parquet"
benchmark_items = "tests/fixtures/benchmark_items.parquet"
